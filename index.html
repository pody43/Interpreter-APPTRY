    <script>
        let blockCount = 1;

        function toggleBreak(id) {
            const el = document.getElementById(`break-group-${id}`);
            el.classList.toggle('hidden');
        }

        function addTimeBlock() {
            blockCount++;
            const container = document.getElementById('timeBlocksContainer');
            const div = document.createElement('div');
            div.className = 'glass-card p-5 space-y-4 relative animate-in slide-in-from-bottom-4 duration-300';
            div.id = `block-${blockCount}`;
            div.innerHTML = `
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold uppercase tracking-wider text-indigo-400">時段 #${blockCount}</span>
                    <button onclick="removeBlock(${blockCount})" class="text-slate-500 hover:text-rose-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <input type="datetime-local" class="start-time text-xs">
                    <input type="datetime-local" class="end-time text-xs">
                </div>
                <div class="pt-2">
                    <button onclick="toggleBreak(${blockCount})" class="text-xs text-slate-400 flex items-center">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0116 0z"></path></svg>
                        設定休息扣除
                    </button>
                    <div id="break-group-${blockCount}" class="hidden mt-3 grid grid-cols-2 gap-3 p-3 rounded-lg bg-black/20">
                        <input type="datetime-local" class="break-start text-xs">
                        <input type="datetime-local" class="break-end text-xs">
                    </div>
                </div>
            `;
            container.appendChild(div);
        }

        function removeBlock(id) { 
            const el = document.getElementById(`block-${id}`);
            if (el) el.remove(); 
        }

        function isNight(date) {
            const h = date.getHours();
            return h < 6 || h >= 22;
        }

        function calculate() {
            const blocks = document.querySelectorAll('[id^="block-"]');
            let segments = [];
            let errorMsg = null;

            blocks.forEach(block => {
                const s = block.querySelector('.start-time').value;
                const e = block.querySelector('.end-time').value;
                if (!s || !e) return;

                const start = new Date(s);
                const end = new Date(e);
                if (end <= start) errorMsg = "時間設定有誤 (結束需大於開始)";

                const bs = block.querySelector('.break-start').value;
                const be = block.querySelector('.break-end').value;
                const bStart = bs ? new Date(bs) : null;
                const bEnd = be ? new Date(be) : null;

                segments.push({ start, end, bStart, bEnd });
            });

            if (errorMsg) { showError(errorMsg); return; }
            if (segments.length === 0) { showError("請輸入服務時段"); return; }

            // 依時間排序
            segments.sort((a, b) => a.start - b.start);
            
            // 建立所有有效分鐘的陣列
            let minuteChain = [];
            segments.forEach(seg => {
                let curr = new Date(seg.start);
                while (curr < seg.end) {
                    const inBreak = seg.bStart && seg.bEnd && curr >= seg.bStart && curr < seg.bEnd;
                    if (!inBreak) {
                        minuteChain.push(new Date(curr));
                    }
                    curr.setMinutes(curr.getMinutes() + 1);
                }
            });

            if (minuteChain.length === 0) { showError("有效時數不足 1 分鐘"); return; }
            hideError();

            let totalFee = 0;
            let details = "";
            let anyNight = false;

            // 1. 基本費 (120 分鐘)
            const p1 = minuteChain.slice(0, 120);
            const p1Night = p1.some(d => isNight(d));
            const p1Fee = p1Night ? 2000 : 1000;
            totalFee += p1Fee;
            if (p1Night) anyNight = true;

            details += `<div class="flex justify-between text-slate-400"><span>基礎費 (前120分) - ${p1Night ? '夜間' : '日間'}</span><span class="text-white font-bold">NT$ ${p1Fee}</span></div>`;

            // 2. 加計費 (第 121 分鐘起，逐小時判定)
            if (minuteChain.length > 120) {
                const p2 = minuteChain.slice(120);
                let idx = 0;
                let hCount = 1;
                while (idx < p2.length) {
                    const slice = p2.slice(idx, idx + 60);
                    const len = slice.length;
                    const night = slice.some(d => isNight(d));
                    
                    let units = 0;
                    let note = "";
                    
                    // 30 分鐘進位規則
                    if (len < 30) { 
                        units = 0.5; 
                        note = "(<30m 進位 0.5h)"; 
                    } else { 
                        units = 1.0; 
                        if (len < 60) note = "(≥30m 進位 1h)"; 
                    }

                    const rate = night ? 1000 : 500;
                    const sub = units * rate;
                    totalFee += sub;
                    if (night) anyNight = true;

                    details += `<div class="flex justify-between text-slate-400"><span>第 ${hCount+2} 小時計費段 (${night?'夜':'日'}) ${note}</span><span class="text-white font-bold">NT$ ${sub}</span></div>`;
                    idx += 60;
                    hCount++;
                }
            }

            // 更新 UI 介面
            const totalHours = Math.floor(minuteChain.length / 60);
            const totalMins = minuteChain.length % 60;
            document.getElementById('displayTotalTime').innerText = `${totalHours}h ${totalMins}m`;
            document.getElementById('displayNightStatus').innerText = anyNight ? "含夜間" : "全日間";
            document.getElementById('displayNightStatus').className = anyNight ? "text-xl font-extrabold text-orange-400" : "text-xl font-extrabold text-emerald-400";
            document.getElementById('calculationDetails').innerHTML = details;
            document.getElementById('displayTotalFee').innerText = `NT$ ${totalFee.toLocaleString()}`;
            
            // 顯示結果並滾動
            document.getElementById('resultArea').classList.remove('hidden');
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function showError(m) { 
            const e = document.getElementById('errorMessage');
            e.innerText = `⚠️ ${m}`; 
            e.classList.remove('hidden'); 
            document.getElementById('resultArea').classList.add('hidden');
        }
        
        function hideError() { 
            document.getElementById('errorMessage').classList.add('hidden'); 
        }
    </script>
</body>
</html>
